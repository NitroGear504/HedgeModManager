name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite
    paths-ignore:
      # Ignore code files.
      - 'HedgeModManager/Resources/Codesv2/**'

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .\HedgeModManager.sln

jobs:
  build:
    name: ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v3.3.0

      - name: Add Git hash to resources
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: echo ${{ github.sha }} > HedgeModManager/Resources/Version.txt

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Restore NuGet packages
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        env:
          UseSharedCompilation: false   # prevent CSC compiler server crashes
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /m:1 /p:Configuration=${{ matrix.configuration }} /p:DesignTimeBuild=false

      - uses: actions/upload-artifact@v4
        with:
          name: HedgeModManager-${{ matrix.configuration }}
          path: ${{ github.workspace }}\HedgeModManager\bin\${{ matrix.configuration }}\net472
